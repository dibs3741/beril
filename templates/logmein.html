{% extends "private3.html" %}  

{% block metrics %}
    <div style="padding:5px;">
        <table id = 'hor-minimalist-a'>
            <thead> 
                <th colspan=2> Login </th> 
            </thead> 
            <tbody> 
            <tr> 
                <td> Username (email): </td> 
                <td><input type="text" id="userid" /></td>
            </tr> 
            <tr> 
                <td> Password: </td> 
                <td><input type="password" id="userpass" /></td>
            </tr> 
            <tr> 
                <td> </td> 
                <td> </td> 
            </tr> 
            <tr> 
                <!-- <td colspan="2" align="right" valign="bottom"> --> 
                <td align="left" valign="bottom"> 
                    <input type="button" id="register" value="Register" />
                </td>
                <td align="right" valign="bottom"> 
                    <input type="button" id="submit1" value="Login" />
                </td>
            </tr> 
            </tbody> 
            <tfoot> 
                <th colspan=2> 
                <div id="txt"> 
                </div>
                </th> 
            </tfoot> 
        </table> <!-- <table id = 'hor-minimalist-a'> --> 
    </div>
{% endblock %} {# metrics #}

{% block scripted %}
<script rel="javascript" type="text/javascript">
$(document).ready(function () {
    $('#register, #submit1').jqxButton({ 
        width: '160px',
        height: '25px',
        theme: 'ui-smoothness'
    });
    $('#userid, #userpass').jqxInput({ 
        width: '300px',
        height: '25px',
        theme: 'ui-smoothness'
    });
    $('#register').click(function () {
        console.log("kya baat register");
        var uid = $('#userid').val();
        var pwd = $('#userpass').val();
        var data = {'username':uid, 'email':uid, 'password':pwd} 
        axios({
            method: 'post',
            url:  '/auth/register/v2',
            config: { headers: {'Content-Type': 'multipart/form-data' }},
            headers: { 'Content-Type': 'application/json' },
            data: data 
        })
        .then((response) => {
            console.log(response.data.data);
            document.getElementById('txt').innerHTML=response.data.data;
        })
        .catch((error) => {
            console.log(response.data.data);
            document.getElementById('txt').innerHTML=response.data.data;
        })
    });
    $('#submit1').click(function () {
        console.log("kya baat submit");
        var uid = $('#userid').val();
        var pwd = $('#userpass').val();
        var data = {'username':uid, 'email':uid, 'password':pwd} 
        axios({
            method: 'post',
            url:  '/auth/login/v2',
            config: { headers: {'Content-Type': 'multipart/form-data' }},
            headers: { 'Content-Type': 'application/json' },
            data: data 
        })
        .then((response) => {
            console.log(response.data) 
            sessionStorage.setItem('accesstoken', response.data.access_token);
            accesstoken = response.data.access_token 
            document.getElementById('txt').innerHTML = "Login successful!"
            /* --------------------
            var url = "folios/v1";

                datatype: "json",

                    { name: 'folio_name' }
                ],
                id: 'id',

            };
            var dataAdapter = new $.jqx.dataAdapter(source, {

                   jqxhr.setRequestHeader("Authorization", 'Bearer ' + accesstoken); 
                },
                downloadComplete: function (data, status, xhr) { 
                   console.log(xhr); 
                }
            });
            $('#id_folio').jqxListBox({ 
                source: dataAdapter
            })
            ---------------------------- */
        })
        .catch((error) => {
            console.log(error); 
            document.getElementById('txt').innerHTML = "Login failed. Incorrect username or password."
        })
    });
});
</script>
{% endblock %} {# scripted #}
